name: Deploy Astro site to Sakura

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Set to true to deploy the current main branch to Sakura."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-astro-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy static site
    if: inputs.deploy
    runs-on: ubuntu-latest
    env:
      WORDPRESS_API_URL: https://style.yh-inc.jp/wp-json/wp/v2

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        run: pnpm build

      - name: Install SSH password helper
        run: sudo apt-get update && sudo apt-get install --yes sshpass

      - name: Synchronize changed static files to Sakura
        env:
          SSHPASS: ${{ secrets.SAKURA_PASSWORD }}
          SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
          SAKURA_SSH_PORT: ${{ secrets.SAKURA_SSH_PORT }}
          SAKURA_USERNAME: ${{ secrets.SAKURA_USERNAME }}
          SAKURA_ASTRO_DEPLOY_PATH: ${{ secrets.SAKURA_ASTRO_DEPLOY_PATH }}
        run: >
          sshpass -e rsync -az --checksum --itemize-changes
          -e "ssh -p $SAKURA_SSH_PORT -o StrictHostKeyChecking=accept-new"
          dist/
          "$SAKURA_USERNAME@$SAKURA_HOST:$SAKURA_ASTRO_DEPLOY_PATH/"
