name: Issue missing Astro article CAs

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of unissued articles to process; 0 issues every unissued article."
        required: true
        type: string
        default: "0"
      deploy:
        description: "Set to true to issue, commit, and deploy the missing CAs."
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: issue-missing-astro-cas
  cancel-in-progress: false

jobs:
  issue:
    name: Issue and deploy missing article CAs
    if: inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WORDPRESS_API_URL: https://style.yh-inc.jp/wp-json/wp/v2
      CA_SERVER_URL: https://playground.originator-profile.org
      CA_ISSUER: dns:example.com
      CA_SERVER_AUTH: ${{ secrets.CA_SERVER_AUTH }}
      CA_BULK_LIMIT: ${{ inputs.limit }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro without the new CAs
        run: pnpm build

      - name: Issue missing CAs for final Astro article HTML
        run: node scripts/issue-missing-astro-article-cas.mjs

      - name: Commit issued CA files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/astro-cas src/data/content-attestations.json
          if git diff --cached --quiet; then
            echo "No new CA files to commit."
          else
            git commit -m "chore: issue missing Astro article CAs"
            git push
          fi

      - name: Rebuild Astro with external CAS references
        run: pnpm build

      - name: Install SSH password helper
        run: sudo apt-get update && sudo apt-get install --yes sshpass

      - name: Synchronize changed static files to Sakura
        env:
          SSHPASS: ${{ secrets.SAKURA_PASSWORD }}
          SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
          SAKURA_SSH_PORT: ${{ secrets.SAKURA_SSH_PORT }}
          SAKURA_USERNAME: ${{ secrets.SAKURA_USERNAME }}
          SAKURA_ASTRO_DEPLOY_PATH: ${{ secrets.SAKURA_ASTRO_DEPLOY_PATH }}
        run: >
          sshpass -e rsync -az --checksum --no-times --itemize-changes
          -e "ssh -p $SAKURA_SSH_PORT -o StrictHostKeyChecking=accept-new"
          dist/
          "$SAKURA_USERNAME@$SAKURA_HOST:$SAKURA_ASTRO_DEPLOY_PATH/"
